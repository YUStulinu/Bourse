name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Matching engine (C++) - tests, real NASDAQ ITCH replay, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: cmake -S engine -B engine/build -G Ninja && cmake --build engine/build
      - name: Tests
        run: engine/build/engine-tests
      - name: Rebuild the books of the start of a real NASDAQ day
        run: |
          PREFIX_MB=40 sh tools/fetch-itch.sh
          engine/build/itch-replay data/itch/prefix.NASDAQ_ITCH50 --json itch.json
          python3 - <<'EOF'
          import json
          r = json.load(open("itch.json"))
          print(r["messages"], "messages,", r["groups_checked"], "execution groups checked")
          assert r["messages"] > 1_000_000
          assert r["unknown_order_references"] == 0 and r["executions_or_cancels_over_open_quantity"] == 0
          assert r["crossed"] == 0 and r["locked"] == 0
          assert r["groups_different"] == 0
          EOF
      - name: Benchmark (short)
        run: engine/build/engine-bench --commands 300000

  gateway:
    name: Gateways (Rust) - OUCH, FIX, ITCH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            gateway/target
          key: cargo-${{ hashFiles('gateway/Cargo.lock') }}
      - run: cd gateway && cargo test --release

  marketdata:
    name: Market data (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd marketdata && go vet ./... && go test ./... && go build -o bin/ ./cmd/...

  risk:
    name: Risk and clearing (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cd risk && ./gradlew test jar --no-daemon

  sim-ui:
    name: Simulation (Python) and order book UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S engine -B engine/build -G Ninja && cmake --build engine/build --target bourse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: cd sim && python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd ui && npm ci && npm test

  system:
    name: The whole exchange - a simulated market replayed over OUCH, Go and C++ agree on real ITCH
    runs-on: ubuntu-latest
    needs: [engine, gateway, marketdata, risk]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            gateway/target
          key: cargo-${{ hashFiles('gateway/Cargo.lock') }}
      - name: Build everything
        run: |
          cmake -S engine -B engine/build -G Ninja && cmake --build engine/build
          cd gateway && cargo build --release && cd ..
          cd marketdata && go build -o bin/ ./cmd/... && cd ..
          cd risk && ./gradlew jar --no-daemon -q && cd ..
          cd ui && npm ci && npm run build && cd ..
          pip install numpy
      - name: Replay a simulated market through the running exchange
        run: python eval/replay_check.py --seconds 120
      - name: Engine, gateway and market data under load
        run: python eval/bench.py --quick --out bench.json
      - name: C++ and Go rebuild the same books from real ITCH
        run: |
          PREFIX_MB=40 sh tools/fetch-itch.sh
          engine/build/itch-replay data/itch/prefix.NASDAQ_ITCH50 --json cpp.json > /dev/null
          marketdata/bin/itchcheck data/itch/prefix.NASDAQ_ITCH50 > go.json
          python3 - <<'EOF'
          import json
          c, g = json.load(open("cpp.json")), json.load(open("go.json"))
          for k in ("messages", "orders_added", "live_orders_at_end", "unknown_order_references", "crossed", "locked", "executed_shares", "hidden_trade_shares"):
              print(k, c[k], g[k])
              assert c[k] == g[k], k
          EOF
